server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker + manifest must never be cached, or updates never arrive
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA: every other path serves index.html (never cached, so deploys show up)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "DENY";
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)";
    try_files $uri /index.html;
  }
}
